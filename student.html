<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធសិស្ស - វិទ្យាល័យកូប</title>
  
  <link rel="icon" href="https://www.dropbox.com/scl/fi/2tds3u7hcslgrtcnfimdg/nv.ico?rlkey=t4swsdf8hv7iwbg23pjknp0wn&st=84qf47bv&dl=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&family=Moul&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- HTML2Canvas & QRCode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body { font-family: 'Noto Sans Khmer', sans-serif; scroll-behavior: smooth; }
    .font-moul { font-family: 'Moul', cursive; font-weight: normal; line-height: 1.8; }
    
    .ql-editor { padding: 0 !important; }
    .ql-editor img { max-width: 100%; height: auto; border-radius: 0.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    
    .loader {
      border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
      width: 40px; height: 40px; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media print {
      body { visibility: hidden; background-color: transparent !important; }
      #card-print-area { visibility: visible; position: absolute; left: 0; top: 0; width: 100%; display: flex !important; justify-content: center !important; }
      #header-container, #app-container, .modal-backdrop { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col relative">

  <div id="header-container"></div>
  <main id="app-container" class="p-4 flex-1"></main>

  <!-- Student Card Modal -->
  <div id="studentCardModal" class="fixed inset-0 bg-black bg-opacity-70 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col relative">
      <div class="absolute top-3 right-3 z-10">
         <button onclick="window.closeCardModal()" class="w-8 h-8 bg-black bg-opacity-30 text-white rounded-full flex items-center justify-center hover:bg-red-500 transition"><i class="fas fa-times"></i></button>
      </div>
      
      <div id="card-print-area" class="w-full relative bg-white overflow-hidden" style="min-height: 500px;">
         <div class="absolute inset-0 z-0">
            <img id="cardBgImage" src="https://i.imgur.com/s46369v.png" class="w-full h-full object-cover" onerror="this.onerror=null; this.style.display='none';">
         </div>
         <div class="relative z-10 flex flex-col items-center pt-28 pb-6 px-6 h-full">
            <div class="w-32 h-32 rounded-lg bg-gray-200 border-4 border-white shadow-lg overflow-hidden mb-4 relative z-20">
               <img id="cardPhoto" src="" class="w-full h-full object-cover">
            </div>
            <h2 id="cardName" class="text-2xl font-moul text-blue-900 mb-1 drop-shadow-sm text-center">ឈ្មោះសិស្ស</h2>
            <div class="bg-blue-800 text-white px-4 py-1 rounded-full text-sm font-bold shadow-md mb-6 tracking-widest" id="cardId">ID: S000</div>
            <div class="w-full bg-white bg-opacity-90 rounded-2xl p-4 shadow-sm border border-blue-100 backdrop-blur-sm mb-4">
               <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-sm text-gray-800">
                  <div class="font-bold text-gray-500">ភេទ៖</div><div id="cardGen" class="font-bold text-right text-blue-900">ប្រុស</div>
                  <div class="font-bold text-gray-500">ថ្នាក់ទី៖</div><div id="cardClass" class="font-bold text-right text-blue-900">10A</div>
                  <div class="font-bold text-gray-500">ឆ្នាំកំណើត៖</div><div id="cardYYYY" class="font-bold text-right text-blue-900">2005</div>
                  <div class="font-bold text-gray-500">ឆ្នាំសិក្សា៖</div><div id="cardYear" class="font-bold text-right text-blue-900">2023-2024</div>
               </div>
            </div>
            <div class="mt-auto bg-white p-2 rounded-xl shadow-sm border"><div id="cardQRCode" class="w-16 h-16"></div></div>
         </div>
         <img id="cardSealImage" src="" class="absolute bottom-4 left-4 w-20 opacity-80 hidden z-10 mix-blend-multiply" onerror="this.onerror=null; this.style.display='none';">
      </div>
      <div class="p-4 bg-gray-50 flex justify-center gap-3 border-t">
         <button onclick="window.downloadCard()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition shadow-md flex items-center justify-center gap-2"><i class="fas fa-download"></i> ទាញយករូបភាព</button>
      </div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div id="changePassModal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col">
      <div class="p-5 border-b bg-gradient-to-r from-blue-50 to-white flex justify-between items-center">
        <h3 class="text-xl font-moul text-blue-800"><i class="fas fa-key text-blue-600 mr-2"></i> ប្តូរពាក្យសម្ងាត់</h3>
        <button onclick="window.closeChangePassModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-red-100 hover:text-red-500 transition"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-6">
        <form onsubmit="window.saveNewPassword(event)" class="space-y-4">
          <div>
            <label class="block text-gray-700 text-sm font-bold mb-1">លេខសម្ងាត់ថ្មី <span class="text-red-500">*</span></label>
            <div class="relative">
              <input type="password" id="newPass" required class="w-full p-3 pr-10 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="វាយពាក្យសម្ងាត់ថ្មីរបស់អ្នក">
              <i class="fas fa-eye absolute right-3 top-3.5 text-gray-400 cursor-pointer hover:text-blue-500 transition" onclick="window.togglePassword('newPass', this)"></i>
            </div>
          </div>
          <div>
            <label class="block text-gray-700 text-sm font-bold mb-1">បញ្ជាក់លេខសម្ងាត់ថ្មី <span class="text-red-500">*</span></label>
            <div class="relative">
              <input type="password" id="confirmPass" required class="w-full p-3 pr-10 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="វាយពាក្យសម្ងាត់ថ្មីម្តងទៀត">
              <i class="fas fa-eye absolute right-3 top-3.5 text-gray-400 cursor-pointer hover:text-blue-500 transition" onclick="window.togglePassword('confirmPass', this)"></i>
            </div>
          </div>
          <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
            <button type="button" onclick="window.closeChangePassModal()" class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition">បោះបង់</button>
            <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition shadow-md flex items-center gap-2"><i class="fas fa-save"></i> រក្សាទុក</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // --- Data URIs for Fallback Images (ការពារកុំឲ្យជាប់ Loading Titlebar) ---
    const fallbackImg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'%3E%3Crect width='150' height='150' fill='%23f3f4f6'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='16' fill='%239ca3af'%3ENo Photo%3C/text%3E%3C/svg%3E";
    const fallbackAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e5e7eb'/%3E%3Cpath d='M20 20a6 6 0 100-12 6 6 0 000 12zm-8 10c0-4.418 3.582-8 8-8s8 3.582 8 8v2H12v-2z' fill='%239ca3af'/%3E%3C/svg%3E";

    // --- Custom Alert/Confirm ---
    window.customAlert = (message, callback) => {
        const modalHtml = `
        <div id="custom-alert-modal" class="fixed inset-0 bg-black bg-opacity-60 z-[200] flex items-center justify-center p-4 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col">
                <div class="p-5 border-b bg-blue-50 text-blue-800 font-moul font-bold flex items-center gap-2">
                    <i class="fas fa-info-circle"></i> ព័ត៌មាន
                </div>
                <div class="p-6 text-gray-700 text-center whitespace-pre-wrap">${message}</div>
                <div class="p-4 border-t flex justify-center">
                    <button id="custom-alert-btn" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition">យល់ព្រម</button>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        document.getElementById('custom-alert-btn').onclick = () => {
            document.getElementById('custom-alert-modal').remove();
            if (callback) callback();
        };
    };

    window.customConfirm = (message, onYes, onNo) => {
        const modalHtml = `
        <div id="custom-confirm-modal" class="fixed inset-0 bg-black bg-opacity-60 z-[200] flex items-center justify-center p-4 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col">
                <div class="p-5 border-b bg-orange-50 text-orange-800 font-moul font-bold flex items-center gap-2">
                    <i class="fas fa-question-circle"></i> បញ្ជាក់
                </div>
                <div class="p-6 text-gray-700 text-center whitespace-pre-wrap leading-relaxed">${message}</div>
                <div class="p-4 border-t flex justify-end gap-3 bg-gray-50">
                    <button id="custom-confirm-no" class="bg-gray-200 text-gray-800 px-5 py-2.5 rounded-xl font-bold hover:bg-gray-300 transition">បោះបង់</button>
                    <button id="custom-confirm-yes" class="bg-orange-500 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-orange-600 transition shadow-md">យល់ព្រម</button>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        document.getElementById('custom-confirm-no').onclick = () => {
            document.getElementById('custom-confirm-modal').remove();
            if (onNo) onNo();
        };
        document.getElementById('custom-confirm-yes').onclick = () => {
            document.getElementById('custom-confirm-modal').remove();
            if (onYes) onYes();
        };
    };

    // --- Firebase Setup ---
    let app, auth, db, appId;
    try {
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
        apiKey: "AIzaSyD1l6lkUCMkOPPE-gR3a8XardlGUUfR3pg",
        authDomain: "ictexam-1ebeb.firebaseapp.com",
        projectId: "ictexam-1ebeb",
        storageBucket: "ictexam-1ebeb.firebasestorage.app",
        messagingSenderId: "18694490334",
        appId: "1:18694490334:web:c5071b02bf72100a78da4f"
      };

      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      appId = typeof __app_id !== 'undefined' ? __app_id : 'ictexam-app'; 
    } catch (error) { console.error("Firebase init error:", error); }

    // --- Global State ---
    let questions = [];
    let results = [];
    let teachersData = [];
    let globalSettings = { cardBgUrl: 'https://i.imgur.com/s46369v.png', sealImageUrl: '' };
    
    let firebaseUser = null;
    let currentUser = null; 
    let loadingData = true;

    // Student Exam State
    let activeDashboardView = 'main'; 
    let activeExamQuestions = null;
    let activeExamContext = null; 
    let studentAnswers = {};
    window.isSubmitting = false; // Flag សម្រាប់ដឹងថាកំពុងបញ្ជូនពិតប្រាកដ ឬបិទទំព័រ

    // Helper: Get Subject
    function getSubject(itemObj, teacherId) {
        if (itemObj.subject && itemObj.subject.trim() !== '') return itemObj.subject.trim();
        const tProfile = teachersData.find(t => t.uid === teacherId) || {};
        if (tProfile.subject && tProfile.subject.trim() !== '') return tProfile.subject.trim();
        return 'ទូទៅ';
    }

    // --- ប្រព័ន្ធការពារការចាកចេញ (Anti-Cheat) ---
    window.addEventListener('beforeunload', function (e) {
        // បើសិស្សកំពុងប្រឡង (មិនមែនមេរៀន) ហើយមិនមែនជាការចុចបញ្ជូនពិតប្រាកដទេ
        if (activeExamContext && !activeExamContext.isLesson && !window.isSubmitting) {
            e.preventDefault();
            e.returnValue = 'អ្នកកំពុងប្រឡង! ប្រសិនបើអ្នកចាកចេញ វិញ្ញាសានឹងត្រូវបញ្ជូនដោយស្វ័យប្រវត្តិ។';
            return e.returnValue;
        }
    });

    async function initApp() {
      const sessionData = localStorage.getItem('studentSession');
      if (sessionData) {
        currentUser = JSON.parse(sessionData);
        try {
           if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
           } else {
              await signInAnonymously(auth);
           }
        } catch(err) { console.error("Auth error", err); }
      } else {
        window.location.replace('index.html'); return;
      }

      onAuthStateChanged(auth, (user) => {
        if (user) { firebaseUser = user; loadFirestoreData(); }
      });
    }

    function loadFirestoreData() {
      if (!firebaseUser) return;
      const qCollection = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
      onSnapshot(query(qCollection), (snapshot) => { questions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderApp(); }, (err) => console.error(err));

      const rCollection = collection(db, 'artifacts', appId, 'public', 'data', 'results');
      onSnapshot(query(rCollection), (snapshot) => { results = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderApp(); }, (err) => console.error(err));

      const tCollection = collection(db, 'artifacts', appId, 'public', 'data', 'teachers');
      onSnapshot(query(tCollection), (snapshot) => { teachersData = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() })); renderApp(); }, (err) => console.error(err));
      
      const settingsDoc = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
      onSnapshot(settingsDoc, (docSnap) => {
        if (docSnap.exists()) {
            globalSettings = { ...globalSettings, ...docSnap.data() };
            const cardBg = document.getElementById('cardBgImage'); if (cardBg) cardBg.src = globalSettings.cardBgUrl || 'https://i.imgur.com/s46369v.png';
            const cardSeal = document.getElementById('cardSealImage'); if (cardSeal) { cardSeal.src = globalSettings.sealImageUrl || ''; cardSeal.style.display = globalSettings.sealImageUrl ? 'block' : 'none'; }
        }
      }, (err) => console.error(err));

      // រង់ចាំទិន្នន័យទាញយកចប់ ទើបឆែកមើលក្រែងលោសិស្សមានបោះបង់ការប្រឡង
      setTimeout(() => { 
          loadingData = false; 
          renderApp(); 
          checkAbandonedExams();
      }, 1000);
    }

    // --- មុខងារ Auto-Submit សម្រាប់ការបោះបង់ប្រឡង (Abandoned Exam) ---
    window.isHandlingAbandon = false;
    async function checkAbandonedExams() {
        if (window.isHandlingAbandon) return;
        const lockedStr = localStorage.getItem('active_exam_lock');
        
        // ប្រសិនបើមាន Lock មានន័យថាសិស្សបាន Reload ឬចេញកណ្តាលទី
        if (lockedStr && currentUser && questions.length > 0) {
            window.isHandlingAbandon = true;
            try {
                const ctx = JSON.parse(lockedStr);
                
                // ផ្ទៀងផ្ទាត់សិស្ស
                if (ctx.studentId !== currentUser.ID) {
                    localStorage.removeItem('active_exam_lock');
                    window.isHandlingAbandon = false;
                    return;
                }
                
                // ឆែកមើលក្រែងលោបានបញ្ជូនចូល Results រួចហើយ
                const existingRes = results.find(r => r.studentId === ctx.studentId && r.teacherId === ctx.teacherId && r.month === ctx.month && r.subject === ctx.subject && !r.isLesson);
                if (existingRes) {
                    localStorage.removeItem('active_exam_lock');
                    window.isHandlingAbandon = false;
                    return;
                }

                // បង្ហាញ UI ថាកំពុងបញ្ជូនអូតូ
                document.getElementById('app-container').innerHTML = `
                   <div class="flex flex-col items-center justify-center h-[60vh]">
                      <div class="loader mb-4 border-red-200 border-top-red-600"></div>
                      <p class="text-red-600 font-bold text-lg text-center px-4">ប្រព័ន្ធកំពុងបញ្ជូនវិញ្ញាសាដែលអ្នកបានចាកចេញកណ្តាលទី...</p>
                   </div>`;

                // ទាញយកសំណួរពាក់ព័ន្ធ
                const myClassStr = String(currentUser.CLASS).trim();
                let examQuestions = questions.filter(q => {
                     const classList = Array.isArray(q.classLevel) ? q.classLevel.map(String) : [String(q.classLevel)];
                     const isMatchClass = classList.some(c => c.trim() === myClassStr);
                     return q.teacherId === ctx.teacherId && q.month === ctx.month && q.subject === ctx.subject && q.type !== 'lesson' && isMatchClass && q.status === 'online';
                });

                // ទាញយកចម្លើយដែល Save Auto ក្នុង Profile របស់ Browser
                const answerKey = `exam_ans_${ctx.studentId}_${ctx.teacherId}_${ctx.month}_${encodeURIComponent(ctx.subject)}_false`;
                const savedAnswersStr = localStorage.getItem(answerKey);
                let savedAnswers = savedAnswersStr ? JSON.parse(savedAnswersStr) : {};

                // គណនាពិន្ទុ
                let totalScore = 0; let totalPoints = 0; let needsGrading = false; let qScores = {};

                examQuestions.forEach(q => {
                    totalPoints += (q.points || 0);
                    const ans = savedAnswers[q.id];
                    if (q.type === 'essay') {
                        needsGrading = true; qScores[q.id] = 0;
                    } else if (q.type === 'multiple_choice_single') {
                        if (ans !== undefined && ans === q.correctAnswer) { totalScore += (q.points || 0); qScores[q.id] = (q.points || 0); } else { qScores[q.id] = 0; }
                    } else if (q.type === 'multiple_choice_multi') {
                        const correctArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
                        const ansArr = Array.isArray(ans) ? ans : [];
                        const isCorrect = correctArr.length === ansArr.length && correctArr.every(val => ansArr.includes(val));
                        if (isCorrect) { totalScore += (q.points || 0); qScores[q.id] = (q.points || 0); } else { qScores[q.id] = 0; }
                    }
                });

                const examData = {
                    studentId: ctx.studentId,
                    studentName: ctx.studentName || `${currentUser.FNAME} ${currentUser.LNAME}`,
                    classLevel: currentUser.CLASS,
                    teacherId: ctx.teacherId,
                    teacherName: ctx.teacherName,
                    subject: ctx.subject,
                    month: ctx.month,
                    isLesson: false,
                    score: totalScore,
                    totalPoints: totalPoints,
                    answers: savedAnswers,
                    questionScores: qScores,
                    needsGrading: needsGrading,
                    timestamp: serverTimestamp(),
                    autoSubmitted: true // សម្គាល់ថាជាការបញ្ជូនព្រោះចាកចេញ
                };

    window.startExam = async (examKeyStr) => {
        document.getElementById('app-container').innerHTML = `
           <div class="flex flex-col items-center justify-center h-[60vh]">
              <div class="loader mb-4 border-blue-200 border-top-blue-600"></div>
              <p class="text-blue-600 font-bold text-lg">កំពុងរៀបចំវិញ្ញាសា...</p>
           </div>`;

        const decodedStr = decodeURIComponent(examKeyStr);
        const parts = decodedStr.split('_|MATCH|_'); 
        const teacherId = parts[0];
        const month = parts[1];
        const subject = parts[2];
        const isLessonFlag = parts[3] === 'true';
        
        const myClassStr = String(currentUser.CLASS).trim();
        let examQuestions = questions.filter(q => {
             const classList = Array.isArray(q.classLevel) ? q.classLevel.map(String) : [String(q.classLevel)];
             const isMatchClass = classList.some(c => c.trim() === myClassStr);
             const subj = getSubject(q, q.teacherId);
             const qIsLesson = q.type === 'lesson';
             
             return q.teacherId === teacherId && q.month === month && subj === subject && qIsLesson === isLessonFlag && isMatchClass && q.status === 'online';
        });

        if (examQuestions.length === 0) { 
            window.customAlert("វិញ្ញាសានេះត្រូវបានបិទ ឬមិនមានសំណួរទេ!", () => { renderApp(); }); 
            return; 
        }

        const standardMonths = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        const currentMonthName = standardMonths[new Date().getMonth()];
        let isExpired = false;
        if (standardMonths.includes(month) && month !== currentMonthName) {
            isExpired = true;
        }

        if (!isLessonFlag && isExpired) {
            window.customAlert("កិច្ចការនេះបានផុតសុពលភាពហើយ (ខុសខែប្រឡង)!", () => { renderApp(); }); 
            return;
        }

        const teacherProfile = teachersData.find(t => t.uid === teacherId) || {};
        
        const existingRes = results.find(r => {
             const rSubj = getSubject(r, teacherId);
             return r.studentId === currentUser.ID && r.teacherId === teacherId && r.month === month && rSubj === subject && (isLessonFlag ? r.isLesson : !r.isLesson);
        });

        if (!isLessonFlag && existingRes) { 
             window.customAlert("អ្នកបានបញ្ជូនចម្លើយរួចរាល់ហើយ។ មិនអាចចូលប្រឡងបានទៀតទេ!", () => { renderApp(); }); 
             return; 
        }

        let randomizedQuestions = [...examQuestions];
        const hasRandomQuestions = randomizedQuestions.some(q => q.displayMode === 'random');
        
        if (hasRandomQuestions && !isLessonFlag) {
            let fixedQs = [], randomQs = [];
            randomizedQuestions.forEach(q => { if(q.displayMode === 'fixed') fixedQs.push(q); else randomQs.push(q); });
            randomQs = shuffleArray(randomQs);
            let finalQs = []; let rIdx = 0;
            randomizedQuestions.forEach(q => { if(q.displayMode === 'fixed') finalQs.push(q); else { finalQs.push(randomQs[rIdx]); rIdx++; } });
            randomizedQuestions = finalQs;
        }

        if (!isLessonFlag) {
            // ដកការក្រឡុកចម្លើយចេញ (A,B,C,D រក្សាលំដាប់ដើម)
            randomizedQuestions = randomizedQuestions.map(q => q);
        } else {
            randomizedQuestions.sort((a, b) => {
                const timeA = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate().getTime() : 0;
                const timeB = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().getTime() : 0;
                return timeA - timeB; 
            });
        }

        window.isSubmitting = false; // Reset flag
        activeExamQuestions = randomizedQuestions;
        activeExamContext = { 
            teacherId, teacherName: teacherProfile.name || '', 
            subject: subject, month, 
            isLesson: isLessonFlag,
            canSubmitLesson: isLessonFlag && !existingRes && !isExpired
        };

        // --- កំណត់សោរការប្រឡង (Lock) ដើម្បីប្រើពេលសិស្សចាកចេញ ---
        if (!isLessonFlag) {
            localStorage.setItem('active_exam_lock', JSON.stringify({
                studentId: currentUser.ID,
                teacherId: teacherId,
                teacherName: teacherProfile.name || '',
                subject: subject,
                month: month
            }));
        }

        // ទាញយកចម្លើយដែល Auto Save ចុងក្រោយពី Browser Profile (LocalStorage)
        const answerKey = `exam_ans_${currentUser.ID}_${teacherId}_${month}_${encodeURIComponent(subject)}_${isLessonFlag}`;
        const savedAnswers = localStorage.getItem(answerKey);
        if (savedAnswers) studentAnswers = JSON.parse(savedAnswers);
        else studentAnswers = {};
        
        renderApp();
    };

    window.saveAnswersToLocal = () => {

                } else {

                    const iconBox = btn.querySelector('.icon-box');

                    iconBox.innerHTML = '';

    window.submitExam = async () => {
        window.isSubmitting = true; // ប្រាប់ប្រព័ន្ធថាសិស្សចុច Submit ពិតប្រាកដ (លែងលោតសារព្រមាន Anti-Cheat)
        const btn1 = document.getElementById('btnSubmitExamFinal'); if(btn1) { btn1.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> កំពុងបញ្ជូន...'; btn1.disabled = true; }
        const btn2 = document.getElementById('btnSubmitExamFinalBottom'); if(btn2) { btn2.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> កំពុងបញ្ជូន...'; btn2.disabled = true; }
        
        let totalScore = 0; let totalPoints = 0; let needsGrading = false; let qScores = {};
        
        activeExamQuestions.forEach(q => {
            if (q.type === 'lesson') return;
            totalPoints += (q.points || 0);
            const ans = studentAnswers[q.id];
            
            if (q.type === 'essay') {
                needsGrading = true; qScores[q.id] = 0;
            } else if (q.type === 'multiple_choice_single') {
                if (ans !== undefined && ans === q.correctAnswer) { totalScore += (q.points || 0); qScores[q.id] = (q.points || 0); } else { qScores[q.id] = 0; }
            } else if (q.type === 'multiple_choice_multi') {
                const correctArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
                const ansArr = Array.isArray(ans) ? ans : [];
                const isCorrect = correctArr.length === ansArr.length && correctArr.every(val => ansArr.includes(val));
                if (isCorrect) { totalScore += (q.points || 0); qScores[q.id] = (q.points || 0); } else { qScores[q.id] = 0; }
            }
        });

        const examData = {
            studentId: currentUser.ID,
            studentName: `${currentUser.FNAME} ${currentUser.LNAME}`,
            classLevel: currentUser.CLASS,
            teacherId: activeExamContext.teacherId,

            month: activeExamContext.month,
            isLesson: false,
            score: totalScore,
            totalPoints: totalPoints,
            answers: studentAnswers,
            questionScores: qScores,
            needsGrading: needsGrading,
            timestamp: serverTimestamp()
        };

        try {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'results'), examData);

            localStorage.removeItem('active_exam_lock');
            
            // លុបទិន្នន័យចម្លើយ Auto-Save ចេញពីម៉ាស៊ីន
            const answerKey = `exam_ans_${currentUser.ID}_${activeExamContext.teacherId}_${activeExamContext.month}_${encodeURIComponent(activeExamContext.subject)}_${activeExamContext.isLesson}`;
            localStorage.removeItem(answerKey);
            
            window.customAlert("បញ្ជូនចម្លើយបានជោគជ័យ! ការប្រឡងត្រូវបានបញ្ចប់ដោយបរិបូរណ៍។", () => { window.exitExam(); });
        } catch (error) {
            window.isSubmitting = false; // បរាជ័យ បើកសិទ្ធិវិញ
            window.customAlert("មានបញ្ហាក្នុងការបញ្ជូនចម្លើយ។ សូមព្យាយាមម្តងទៀត។");
            if(btn1) { btn1.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> បញ្ជូនចម្លើយ'; btn1.disabled = false; }
            if(btn2) { btn2.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> បញ្ជូនចម្លើយ'; btn2.disabled = false; }

               <button onclick="window.logout()" class="w-9 h-9 flex items-center justify-center rounded-full bg-red-500 hover:bg-red-400 transition shadow-sm border border-red-400" title="ចាកចេញ"><i class="fas fa-sign-out-alt text-sm"></i></button>
            </div>
          </div>
        </header>
      `;
    }

    function renderStudent() {
      if (activeExamQuestions) {
         if (activeExamContext.isLesson) return renderLessonInterface();
         else return renderExamInterface();
      }

      if (loadingData) return `<div class="flex flex-col items-center justify-center h-64"><div class="loader mb-4 border-blue-200 border-top-blue-600"></div><p class="text-blue-600 font-bold">កំពុងរៀបចំទិន្នន័យ...</p></div>`;

      const myClassStr = String(currentUser.CLASS).trim();
      const availableQuestions = questions.filter(q => {
         const classList = Array.isArray(q.classLevel) ? q.classLevel.map(String) : [String(q.classLevel)];
         return classList.some(c => c.trim() === myClassStr) && q.status === 'online';
      });

      const groupedExams = {};
      availableQuestions.forEach(q => {
         const subj = getSubject(q, q.teacherId);
         const isLessonType = q.type === 'lesson'; 
         
         const key = `${q.teacherId}_|MATCH|_${q.month}_|MATCH|_${subj}_|MATCH|_${isLessonType}`; 
            
         if (!groupedExams[key]) groupedExams[key] = { 
             teacherId: q.teacherId, teacherName: q.teacherName, 
             month: q.month, subject: subj, isLesson: isLessonType, 
             questions: [],
             createdAt: q.createdAt && q.createdAt.toDate ? q.createdAt.toDate().getTime() : 0 
         };
         groupedExams[key].questions.push(q);
         
         let qTime = q.createdAt && q.createdAt.toDate ? q.createdAt.toDate().getTime() : 0;
         if (qTime > groupedExams[key].createdAt) groupedExams[key].createdAt = qTime;
      });

      // តម្រៀបពីថ្មីនៅលើ
      const groupedExamsArray = Object.entries(groupedExams).map(([keyStr, exam]) => ({ keyStr, ...exam }));
      groupedExamsArray.sort((a, b) => b.createdAt - a.createdAt);

      const standardMonths = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
      const currentMonthName = standardMonths[new Date().getMonth()];

      let examsHtml = ''; let lessonsHtml = '';
      let examCount = 0; let lessonCount = 0;
      
      groupedExamsArray.forEach((exam) => {
         const isLesson = exam.isLesson;
         const qCount = exam.questions.length;
         const keyStr = exam.keyStr;
         
         let isExpired = false;
         if (standardMonths.includes(exam.month)) {
             isExpired = exam.month !== currentMonthName;
         }
         
         const existingRes = results.find(r => {
             const rSubj = getSubject(r, exam.teacherId);
             return r.studentId === currentUser.ID && r.teacherId === exam.teacherId && r.month === exam.month && rSubj === exam.subject && (isLesson ? r.isLesson : !r.isLesson);
         });
         
         const teacherProfile = teachersData.find(t => t.uid === exam.teacherId) || {};
         const tName = teacherProfile.name || exam.teacherName || 'លោកគ្រូ/អ្នកគ្រូ';
         const safeKeyStr = encodeURIComponent(keyStr).replace(/'/g, "%27");

         if (isLesson) {
             lessonCount++;
             let previewText = exam.questions.length > 0 ? `សរុបមាន ${exam.questions.length} ចំណុច` : 'មេរៀន';
             
             lessonsHtml += `
             <div class="bg-white rounded-2xl p-5 border ${existingRes ? 'border-gray-200 opacity-80' : 'border-purple-200 shadow-sm hover:shadow-md transition'} relative flex flex-col h-full">
               <div class="flex items-start justify-between mb-4">
                  <div class="flex items-center gap-3">
                     <div class="w-12 h-12 ${existingRes ? 'bg-gray-100 text-gray-400' : 'bg-purple-100 text-purple-600'} rounded-full flex items-center justify-center text-xl font-bold border border-white shadow-sm shrink-0"><i class="fas fa-book-reader"></i></div>
                     <div class="overflow-hidden">
                        <h3 class="font-bold text-gray-800 text-lg leading-tight truncate" title="${exam.subject}">${exam.subject}</h3>
                        <p class="text-xs text-purple-600 font-semibold mt-1">ខែ៖ ${exam.month}</p>
                     </div>
                  </div>
               </div>
               <div class="text-sm text-purple-700 font-bold mb-5 flex items-center gap-2 mt-auto"><i class="fas fa-layer-group"></i> ${previewText}</div>
               <div class="text-sm text-gray-600 mb-5 flex items-center gap-2"><i class="fas fa-chalkboard-teacher text-gray-400"></i> ដោយ៖ <span class="font-bold text-gray-700">${tName}</span></div>
               <button onclick="window.startExam('${safeKeyStr}')" class="w-full ${existingRes ? 'bg-gray-100 text-gray-600 hover:bg-gray-200' : 'bg-purple-600 hover:bg-purple-700 text-white'} font-bold py-3 rounded-xl transition shadow-sm flex items-center justify-center gap-2 text-sm">
                 <i class="fas ${existingRes ? 'fa-history' : 'fa-book-open'}"></i> ${existingRes ? 'ចូលអានឡើងវិញ' : (isExpired ? 'ចូលអាន (ផុតសុពលភាព)' : 'ចូលអានមេរៀន')}
               </button>
             </div>`;
         } else {
             examCount++;
             let totalPoints = exam.questions.reduce((sum, q) => sum + (q.points || 0), 0);
             
             examsHtml += `
             <div class="bg-white rounded-2xl p-5 border ${existingRes ? 'border-gray-200 opacity-80' : 'border-blue-200 shadow-sm hover:shadow-md transition'} relative flex flex-col h-full">
               <div class="flex items-start justify-between mb-3 gap-2">
                 <div class="flex items-center gap-3">
                   <div class="w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold border border-white shadow-sm shrink-0 ${existingRes ? 'bg-gray-100 text-gray-400' : 'bg-blue-100 text-blue-600'}"><i class="fas fa-file-alt"></i></div>
                   <div class="overflow-hidden">
                     <h3 class="font-bold text-gray-800 text-lg leading-tight truncate" title="${exam.subject}">${exam.subject}</h3>
                     <p class="text-xs text-blue-600 font-semibold mt-1 bg-blue-50 inline-block px-2 py-0.5 rounded border border-blue-100">ខែ៖ ${exam.month}</p>
                   </div>
                 </div>
               </div>
               
               <div class="text-sm text-gray-600 mb-4 flex items-center gap-2 truncate mt-auto"><i class="fas fa-chalkboard-teacher text-gray-400"></i> ដោយ៖ <span class="font-bold text-gray-700 truncate">${tName}</span></div>
               
               <div class="flex justify-around items-center bg-gray-50 p-2 rounded-xl mb-4 border border-gray-100">
                  <div class="text-center">
                     <div class="text-gray-500 text-[10px] font-bold uppercase tracking-wider">សំណួរ</div>
                     <div class="font-extrabold text-gray-800">${qCount}</div>
                  </div>
                  <div class="w-px h-6 bg-gray-200"></div>
                  <div class="text-center">
                     <div class="text-gray-500 text-[10px] font-bold uppercase tracking-wider">ពិន្ទុ</div>
                     <div class="font-extrabold text-orange-500">${totalPoints}</div>
                  </div>
               </div>

               ${existingRes 
                 ? `<button disabled class="w-full bg-gray-100 text-gray-500 font-bold py-3 rounded-xl transition shadow-sm flex items-center justify-center gap-2 text-sm cursor-not-allowed border border-gray-200"><i class="fas fa-lock text-gray-400"></i> បានប្រឡងរួច</button>` 
                 : (isExpired 
                    ? `<button disabled class="w-full bg-red-50 text-red-500 font-bold py-3 rounded-xl transition shadow-sm flex items-center justify-center gap-2 text-sm cursor-not-allowed border border-red-200"><i class="fas fa-ban"></i> ផុតសុពលភាព</button>`
                    : `<button onclick="window.startExam('${safeKeyStr}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 text-sm"><i class="fas fa-pen-nib"></i> ចាប់ផ្តើមធ្វើវិញ្ញាសា</button>`
                 )}
             </div>`;
         }
      });

      // --- រចនាប័ទ្ម Main Dashboard View ---
      if (activeDashboardView === 'main') {
          return `
            <div class="max-w-5xl mx-auto px-2 sm:px-4 space-y-8 pb-10 mt-6">
               <!-- Welcome Banner -->
               <div class="bg-gradient-to-r from-blue-600 to-blue-800 rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden flex flex-col sm:flex-row items-center justify-between gap-6 border-b-4 border-blue-400">
                  <div class="absolute top-0 right-0 opacity-10 text-9xl -mt-10 -mr-10"><i class="fas fa-graduation-cap"></i></div>
                  <div class="relative z-10 text-center sm:text-left">
                     <h2 class="text-2xl sm:text-4xl font-moul mb-3 drop-shadow-md">សួស្តី, ${currentUser.FNAME} ${currentUser.LNAME}! 👋</h2>
                     <p class="text-blue-100 font-medium max-w-lg text-lg">សូមស្វាគមន៍មកកាន់ប្រព័ន្ធសិក្សានៃវិទ្យាល័យកូប។ តើថ្ងៃនេះអ្នកចង់ធ្វើអ្វីដែរ?</p>
                  </div>
               </div>

               <!-- Two Main Choices -->
               <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                  <button onclick="window.setDashboardView('lessons')" class="bg-white p-8 rounded-3xl shadow-sm border-2 border-transparent hover:border-purple-400 hover:shadow-lg transition-all text-center group transform hover:-translate-y-1">
                      <div class="w-24 h-24 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-5 text-4xl group-hover:scale-110 transition duration-300 shadow-inner"><i class="fas fa-book-open"></i></div>
                      <h3 class="text-2xl font-moul text-gray-800 mb-2">មេរៀន / អំណាន</h3>
                      <p class="text-gray-500 font-semibold mb-6">ចូលអានមេរៀន ឯកសារ និងអត្ថបទថ្មីៗ</p>
                      <span class="bg-purple-100 text-purple-700 font-bold px-5 py-2 rounded-full text-sm border border-purple-200">មាន ${lessonCount} ចំណុច</span>
                  </button>

                  <button onclick="window.setDashboardView('exams')" class="bg-white p-8 rounded-3xl shadow-sm border-2 border-transparent hover:border-blue-400 hover:shadow-lg transition-all text-center group transform hover:-translate-y-1">
                      <div class="w-24 h-24 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-5 text-4xl group-hover:scale-110 transition duration-300 shadow-inner"><i class="fas fa-pen-square"></i></div>
                      <h3 class="text-2xl font-moul text-gray-800 mb-2">វិញ្ញាសាប្រឡង</h3>
                      <p class="text-gray-500 font-semibold mb-6">ចូលធ្វើវិញ្ញាសា លំហាត់ ឬការប្រឡងប្រចាំខែ</p>
                      <span class="bg-blue-100 text-blue-700 font-bold px-5 py-2 rounded-full text-sm border border-blue-200">មាន ${examCount} វិញ្ញាសា</span>
                  </button>
               </div>
            </div>
          `;
      } 
      // --- រចនាប័ទ្ម Exams View ---
      else if (activeDashboardView === 'exams') {
          return `
            <div class="max-w-6xl mx-auto px-2 sm:px-4 space-y-6 pb-10 mt-6">
               <div class="flex items-center gap-4 mb-8 bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                  <button onclick="window.setDashboardView('main')" class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center text-gray-600 hover:bg-blue-600 hover:text-white transition shadow-sm border border-gray-200"><i class="fas fa-arrow-left text-xl"></i></button>
                  <div>
                      <h2 class="text-xl sm:text-2xl font-moul text-blue-900 leading-tight">វិញ្ញាសាប្រឡង / លំហាត់</h2>
                      <p class="text-sm text-gray-500 font-semibold mt-1">ជ្រើសរើសមុខវិជ្ជាណាមួយខាងក្រោមដើម្បីចាប់ផ្តើម</p>
                  </div>
               </div>
               ${examsHtml ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">${examsHtml}</div>` : `<div class="bg-white p-12 rounded-3xl text-center shadow-sm border border-gray-200 border-dashed"><div class="text-6xl text-gray-300 mb-4"><i class="fas fa-box-open"></i></div><p class="text-gray-500 font-medium text-lg">មិនទាន់មានវិញ្ញាសាប្រឡងសម្រាប់អ្នកនៅឡើយទេ។</p></div>`}
            </div>
          `;
      }
      // --- រចនាប័ទ្ម Lessons View ---
      else if (activeDashboardView === 'lessons') {
          return `
            <div class="max-w-6xl mx-auto px-2 sm:px-4 space-y-6 pb-10 mt-6">
               <div class="flex items-center gap-4 mb-8 bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                  <button onclick="window.setDashboardView('main')" class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center text-gray-600 hover:bg-purple-600 hover:text-white transition shadow-sm border border-gray-200"><i class="fas fa-arrow-left text-xl"></i></button>
                  <div>
                      <h2 class="text-xl sm:text-2xl font-moul text-purple-900 leading-tight">មេរៀន / អំណាន</h2>
                      <p class="text-sm text-gray-500 font-semibold mt-1">ជ្រើសរើសមេរៀនណាមួយខាងក្រោមដើម្បីចូលអាន</p>
                  </div>
               </div>
               ${lessonsHtml ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">${lessonsHtml}</div>` : `<div class="bg-white p-12 rounded-3xl text-center shadow-sm border border-gray-200 border-dashed"><div class="text-6xl text-gray-300 mb-4"><i class="fas fa-book"></i></div><p class="text-gray-500 font-medium text-lg">មិនទាន់មានមេរៀនសម្រាប់អាននៅឡើយទេ។</p></div>`}
            </div>
          `;
      }
    }

    function renderLessonInterface() {
        return `
        <div class="max-w-4xl mx-auto px-2 sm:px-4 py-4 sm:py-6 h-[calc(100vh-80px)] flex flex-col">
            <div class="bg-white rounded-t-2xl border-b border-gray-200 p-4 sm:p-5 flex justify-between items-center shadow-sm shrink-0">
               <div>
                  <h2 class="text-lg sm:text-xl font-moul text-purple-800 truncate leading-tight"><i class="fas fa-book-reader mr-2"></i>${activeExamContext.subject}</h2>
                  <p class="text-xs sm:text-sm text-gray-500 mt-1 font-semibold">អត្ថបទមេរៀនទាំងអស់</p>
               </div>
               <button onclick="window.exitExam()" class="w-10 h-10 bg-gray-100 text-gray-600 rounded-full flex items-center justify-center hover:bg-red-100 hover:text-red-600 transition shadow-sm border"><i class="fas fa-times text-lg"></i></button>
            </div>
            
            <div class="bg-white p-5 sm:p-8 flex-1 overflow-y-auto shadow-sm text-gray-800 text-base sm:text-lg leading-relaxed font-serif border-x border-gray-200 space-y-8">
               ${activeExamQuestions.map((q, idx) => `
                   <div class="border-b border-dashed border-gray-300 pb-8 mb-8 last:border-0 last:mb-0 last:pb-0">
                       <div class="flex items-center gap-2 mb-4">
                           <span class="bg-purple-100 text-purple-700 font-bold px-4 py-1.5 rounded-lg text-sm border border-purple-200">${idx + 1}</span>
                       </div>
                       <div class="ql-editor !p-0">${q.text}</div>
                   </div>
               `).join('')}
            </div>
            
            <div class="bg-gray-50 border-t border-gray-200 border-x rounded-b-2xl p-4 flex justify-end items-center shadow-sm shrink-0">
               ${activeExamContext.canSubmitLesson 
                 ? `<button id="btnSubmitLesson" onclick="window.submitLessonRead()" class="px-6 py-3 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition shadow-md flex items-center gap-2 text-lg"><i class="fas fa-check-circle"></i> បញ្ចប់ការអាន</button>`
                 : `<button onclick="window.exitExam()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 transition shadow-sm flex items-center gap-2 text-lg"><i class="fas fa-arrow-left"></i> ត្រឡប់ក្រោយ</button>`
               }
            </div>
        </div>`;
    }

    function renderExamInterface() {
      return `
        <div class="max-w-4xl mx-auto px-2 sm:px-4 py-4 sm:py-6 h-[calc(100vh-80px)] flex flex-col">
           
           <!-- Main Content Area -->
           <div class="flex-1 flex flex-col min-w-0 bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden h-full">
               
               <!-- Header -->
               <div class="bg-gray-50 border-b border-gray-200 p-4 sm:p-5 flex justify-between items-center shadow-sm shrink-0">
                  <div class="min-w-0 pr-4">
                     <h2 class="text-lg sm:text-xl font-moul text-blue-900 truncate"><i class="fas fa-pen-nib text-blue-500 mr-2"></i>${activeExamContext.subject}</h2>
                     <p class="text-xs sm:text-sm text-gray-500 font-semibold mt-1">សូមអូសមើល និងឆ្លើយសំណួរទាំងអស់ខាងក្រោម</p>
                  </div>
                  <div class="flex items-center gap-3">
                     <!-- ជំនួស Timer ដោយប្រអប់ពិន្ទុ ឬព័ត៌មាន -->
                     <div class="bg-blue-100 text-blue-800 font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded-xl border-2 border-blue-200 shadow-sm shrink-0">
                         សរុប ${activeExamQuestions.length} សំណួរ
                     </div>
                  </div>
               </div>
               
               <!-- Questions List View (All in One Page) -->
               <div class="p-5 sm:p-8 flex-1 overflow-y-auto scroll-smooth space-y-10 bg-white relative">
                  ${activeExamQuestions.map((q, idx) => {
                     const isEssay = q.type === 'essay';
                     const isMulti = q.type === 'multiple_choice_multi';
                     let existingAns = studentAnswers[q.id];

                     let answerArea = '';
                     if (isEssay) {
                         answerArea = `<textarea class="w-full p-4 border-2 border-blue-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition text-base sm:text-lg min-h-[150px] bg-blue-50 resize-y" placeholder="វាយបញ្ចូលចម្លើយរបស់អ្នកនៅទីនេះ..." oninput="window.saveEssayAnswerUI('${q.id}', this.value)">${existingAns || ''}</textarea>`;
                     } else {
                         answerArea = `<div class="space-y-3" id="q-options-${q.id}">
                             ${(q.options || []).map((opt, oIdx) => {
                                 let isSelected = Array.isArray(existingAns) ? existingAns.includes(oIdx) : existingAns === oIdx;
                                 let btnClass = isSelected ? "bg-blue-50 border-blue-500 text-blue-900" : "bg-white border-gray-200 text-gray-700 hover:border-blue-300 hover:bg-gray-50";
                                 let iconClass = isSelected 
                                    ? (isMulti ? "w-6 h-6 rounded border-2 border-blue-500 bg-blue-500 text-white flex items-center justify-center shrink-0 mt-0.5" : "w-6 h-6 rounded-full border-8 border-blue-500 shrink-0 mt-0.5 bg-white")
                                    : (isMulti ? "w-6 h-6 rounded border-2 border-gray-300 shrink-0 mt-0.5 group-hover:border-blue-300 transition" : "w-6 h-6 rounded-full border-2 border-gray-300 shrink-0 mt-0.5 group-hover:border-blue-300 transition");
                                 let iconInner = (isSelected && isMulti) ? '<i class="fas fa-check text-sm"></i>' : '';

                                 return `<button class="opt-btn w-full text-left p-4 border-2 rounded-2xl transition flex items-start gap-4 text-base sm:text-lg cursor-pointer shadow-sm relative overflow-hidden group ${btnClass}" onclick="window.selectOptionUI('${q.id}', ${oIdx}, '${q.type}')">
                                            <div class="icon-box ${iconClass}">${iconInner}</div>
                                            <div class="flex-1 text-left pt-0.5"><span class="font-bold mr-2 text-gray-400 group-hover:text-gray-500 transition">${String.fromCharCode(65 + oIdx)}.</span>${opt}</div>
                                         </button>`;
                             }).join('')}
                         </div>`;
                     }

                     return `
                     <div id="q-${q.id}" class="scroll-mt-6 border border-gray-200 rounded-3xl p-5 sm:p-6 shadow-sm bg-white">
                         <div class="flex items-center gap-2 mb-4 pb-3 border-b border-dashed border-gray-200">
                            <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center">${idx + 1}</span>
                            <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100">${q.points} ពិន្ទុ</span>
                         </div>
                         <div class="text-gray-800 text-lg mb-6 ql-editor font-serif !p-0">${q.text}</div>
                         ${answerArea}
                     </div>`;
                  }).join('')}

                  <div class="mt-10 pt-6 border-t border-dashed border-gray-300 flex justify-center pb-8">
                     <button id="btnSubmitExamFinalBottom" onclick="window.confirmSubmitExam()" class="px-8 py-4 bg-green-600 text-white rounded-2xl font-bold hover:bg-green-700 transition shadow-lg flex items-center justify-center gap-2 text-lg w-full md:w-auto min-w-[250px]"><i class="fas fa-paper-plane"></i> បញ្ជូនចម្លើយ</button>
                  </div>
               </div>
           </div>
        </div>
      `;
    }

    function renderApp() {
      renderHeader();
      document.getElementById('app-container').innerHTML = renderStudent();
      document.querySelectorAll('.math-render').forEach(el => {
          try { katex.render(el.innerText, el, { throwOnError: false, displayMode: false }); } catch(e){}
      });
    }

    initApp();
  </script>
</body>
</html>
